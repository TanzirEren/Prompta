plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prompta.tg'
    compileSdk 34

    defaultConfig {
        applicationId "com.prompta.tg"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    // Fix duplicate annotations from jetbrains transitive deps
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains:annotations:23.0.0'
            exclude group: 'org.jetbrains', module: 'annotations-java5'
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.fragment:fragment:1.8.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // CardView & RecyclerView
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Preference
    implementation 'androidx.preference:preference:1.2.1'

    // Gson (local storage)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Retrofit (Phase 3 - Telegram API)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // WorkManager (Phase 3 - Background sync)
    implementation 'androidx.work:work-runtime:2.9.0'

    // Markwon (Phase 2 - Markdown rendering)
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:editor:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
}
